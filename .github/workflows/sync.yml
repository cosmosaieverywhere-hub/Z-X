name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: false
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Clear any existing origin to avoid conflicts
          git remote rm hf || true
          
          # 2. Add the HF Space as a remote
          git remote add hf https://z-x-25:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/z-x-25/X
          
          # 3. Force push the 'main' branch to the remote 'main'
          git push hf main --force
